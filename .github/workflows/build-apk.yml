name: Build Mini Office v1.0 APK (arm64-v8a)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1 (không cần tạo gradlew trước)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: sdkmanager --install "ndk;27.2.12479018" "build-tools;35.0.0"

      - name: Setup Rust (arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo & cargo-ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-rust-ndk-${{ hashFiles('rust-core/Cargo.toml') }}

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Run Rust Core unit tests
        working-directory: rust-core
        run: cargo test

      - name: Build optimized Rust .so (arm64-v8a)
        working-directory: rust-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          cargo ndk -t arm64-v8a -o ../android-app/app/src/main/jniLibs build --release

      - name: Generate Kotlin UniFFI bindings
        working-directory: rust-core
        run: |
          mkdir -p ../android-app/app/src/main/kotlin-gen
          cargo run --bin uniffi-bindgen generate \
            --library ../android-app/app/src/main/jniLibs/arm64-v8a/libmini_office_core.so \
            --language kotlin \
            --out-dir ../android-app/app/src/main/kotlin-gen

      - name: Decode Release Keystore (nếu đã cấu hình Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (không cần Android Studio / gradlew)
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Audit Offline Guarantee (Bắt buộc 0 quyền INTERNET)
        run: |
          APK=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Auditing APK: $APK"
          PERMS=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump permissions "$APK")
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "ERROR: Phát hiện quyền INTERNET trong APK!"
            exit 1
          fi
          echo "OK: APK đảm bảo 0 quyền truy cập mạng."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-office-v1.0-arm64-apk
          path: android-app/app/build/outputs/apk/**/*.apk
